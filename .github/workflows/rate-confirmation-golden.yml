name: Rate Confirmation Golden Test

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/rate-confirmation-golden.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/rate-confirmation-golden.yml'

jobs:
  golden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_PRIMARY: gemini-3.6-flash
      GEMINI_MODEL_FALLBACK_1: gemini-2.5-flash
      GEMINI_MODEL_FALLBACK_2: gemini-3.1-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:golden
